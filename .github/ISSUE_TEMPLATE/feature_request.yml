name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do
      description: Describe the problem first, then the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you do it today, or what else did you consider
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the existing issues
          required: true
