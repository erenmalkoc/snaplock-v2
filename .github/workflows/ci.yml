name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests, debug build and lint
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug --no-daemon

  # Sends the resolved Gradle dependencies to GitHub's dependency graph so Dependabot
  # alerts cover the Android libraries. Push to main only: fork PRs get no write token.
  dependency-submission:
    name: Submit Gradle dependency graph
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/dependency-submission@v5
        with:
          dependency-graph-include-configurations: '(debug|release)RuntimeClasspath'

